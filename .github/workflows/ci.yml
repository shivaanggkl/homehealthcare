name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  epic5-api-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run Epic 5 API regression suite
        run: ./gradlew epic5ApiTest

  epic4-api-regression:
    runs-on: ubuntu-latest
