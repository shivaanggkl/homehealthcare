spring.application.name=homehealthcare
spring.datasource.url=jdbc:h2:mem:homehealthcare;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
security.session.access-token-ttl=15m
security.session.refresh-token-ttl=30d
security.session.idle-timeout=30m
security.session.absolute-session-duration=12h
security.session.warning-window=2m
security.login-protection.enabled=true
security.login-protection.failure-threshold=5
security.login-protection.failure-window=15m
security.login-protection.temporary-lockout-duration=15m
security.login-protection.max-attempts-per-ip=20
security.login-protection.max-attempts-per-email=10
security.login-protection.rate-limit-window=1m
security.mfa.issuer=HomeHealthCare
security.mfa.enrollment-challenge-ttl=5m
security.mfa.recovery-code-count=8
