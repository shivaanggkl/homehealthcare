plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.homehealthcare'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('authMfaTest', Test) {
	group = 'verification'
	description = 'Runs the authentication and MFA regression suite.'
	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	filter {
		includeTestsMatching 'com.homehealthcare.auth.api.LoginIntegrationTest'
		includeTestsMatching 'com.homehealthcare.auth.api.LogoutIntegrationTest'
		includeTestsMatching 'com.homehealthcare.invitation.application.AcceptInvitationServiceTest'
		includeTestsMatching 'com.homehealthcare.auth.api.ForgotPasswordIntegrationTest'
		includeTestsMatching 'com.homehealthcare.auth.api.ResetPasswordIntegrationTest'
		includeTestsMatching 'com.homehealthcare.auth.api.ChangePasswordIntegrationTest'
		includeTestsMatching 'com.homehealthcare.auth.api.MfaEnrollmentIntegrationTest'
		includeTestsMatching 'com.homehealthcare.auth.api.MfaLoginChallengeIntegrationTest'
		includeTestsMatching 'com.homehealthcare.auth.api.FailedLoginProtectionLockoutIntegrationTest'
		includeTestsMatching 'com.homehealthcare.auth.api.FailedLoginProtectionRateLimitIntegrationTest'
	}
}

